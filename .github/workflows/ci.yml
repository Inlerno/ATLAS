name: CI

on:
  push:
    branches:
      - main
      # Guarantees the first run (issue #5) even if the PR base branch has no workflow yet.
      - chore/5-windows-ci
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (build, fmt, clippy, test)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustup default stable

      - name: Show environment
        shell: bash
        run: |
          echo "commit: $(git rev-parse HEAD)"
          git log -1 --format='%H %P %s'
          echo "workspace: $GITHUB_WORKSPACE"
          node --version
          npm --version
          rustc --version
          cargo --version
          rustup show active-toolchain

      - name: Forbid panic = "abort"
        shell: bash
        run: |
          # Module failure isolation (#9, ADR-014) relies on unwinding: a panic
          # in a module task is caught only with panic = "unwind".
          if grep -nE "^[[:space:]]*panic[[:space:]]*=[[:space:]]*[\"']abort[\"']" src-tauri/Cargo.toml; then
            echo "::error file=src-tauri/Cargo.toml::panic = \"abort\" is forbidden: module failure isolation relies on unwinding (ADR-014)"
            exit 1
          fi
          echo "OK: no panic = \"abort\" in src-tauri/Cargo.toml"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: npm ci
        run: npm ci

      # Must run before cargo: tauri::generate_context!() reads frontendDist.
      - name: Frontend build (tsc + vite)
        run: npm run build

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # Demo modules (#12) exist only with the feature `demo-modules`: the
      # normal build above has none of their code, so it is checked separately.
      - name: cargo clippy (demo-modules)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --features demo-modules -- -D warnings

      - name: cargo test (demo-modules)
        working-directory: src-tauri
        run: cargo test --locked --features demo-modules

      - name: cargo doc
        working-directory: src-tauri
        run: cargo doc --locked --no-deps

      # The release profile is what users run: the storage tests (ADR-016) compare
      # database files byte for byte and start helper processes, so they are run
      # in it too, on Windows itself.
      - name: cargo test --release
        working-directory: src-tauri
        run: cargo test --locked --release

      - name: cargo test --release (demo-modules)
        working-directory: src-tauri
        run: cargo test --locked --release --features demo-modules

      # The declared minimum (`rust-version = "1.90"` in Cargo.toml). sqlx 0.8.x
      # declares no `rust-version` of its own, so cargo cannot refuse an
      # incompatible compiler: only a build on 1.90 itself shows it (ADR-016).
      # The steps above keep using `stable`.
      - name: cargo build (Rust 1.90.0, the declared minimum)
        working-directory: src-tauri
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 --version
          cargo +1.90.0 build --locked
          cargo +1.90.0 build --locked --features demo-modules

  # The built-in tests of tools/windows/sqlite-foundation-check.ps1 (#28),
  # run with -SelfTest. They need no
  # Rust, no Node.js and no build: every case runs the script with -TestBase in
  # a temporary directory of its own, so ATLAS is never started and
  # %LOCALAPPDATA% is never read. Run in both shells the script supports.
  sqlite-check-script:
    name: SQLite check script tests (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            shell: powershell
          - name: PowerShell 7
            shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `shell` takes no expression, so each shell has a step of its own and the
      # matrix chooses one. The tests run in a child process with explicit
      # flags, the way a user starts them. The test file prints the number of
      # cases, checks and failed checks and ends with a non-zero exit code when
      # any check failed.
      - name: Tests in Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          git log -1 --format='%H %P %s'
          $PSVersionTable | Out-String
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools\windows\sqlite-foundation-check.ps1 -SelfTest
          exit $LASTEXITCODE

      - name: Tests in PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          git log -1 --format='%H %P %s'
          $PSVersionTable | Out-String
          & pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools\windows\sqlite-foundation-check.ps1 -SelfTest
          exit $LASTEXITCODE
