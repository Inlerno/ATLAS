[package]
name = "atlas"
version = "0.1.0"
description = "ATLAS — local AI assistant for Windows"
authors = ["Inlerno"]
edition = "2024"
# Minimum Rust version required by the Tauri 2.12 dependency graph (tauri-utils, tauri-runtime-wry, tray-icon).
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Core foundation (issue #6). Features are listed explicitly; do not rely on feature unification.
thiserror = { version = "2.0.21", features = ["std"] }
# default-features = false: the `attributes` feature (#[instrument], tracing-attributes) is not used.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["std", "registry", "fmt", "ansi", "env-filter", "tracing-log"] }
tracing-appender = "0.2.5"
# Event bus (issue #8) and module manager (issue #9): sync = broadcast/mpsc/oneshot/watch,
# rt = a task per module call, time = timeouts. Already in the Tauri tree; declared explicitly.
tokio = { version = "1.54.1", features = ["sync", "rt", "time"] }
# Module manager (issue #9): CancellationToken and TaskTracker (feature `rt`). Already in the lock file.
tokio-util = { version = "0.7.20", features = ["rt"] }
# SQLite storage (SQLite foundation, ADR-016). Exact version: sqlx 0.8.x declares no
# `rust-version`, so a newer 0.8 release could break Rust 1.90 only at compile time.
# `sqlite` bundles SQLite (compiled from C); `migrate` = the migrator, without the
# `macros` feature (`sqlx::migrate!()` is not used). Used only in `src/storage/`.
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }

# Temporary local fork of sqlx-sqlite 0.8.6 (ADR-016). It is the published 0.8.6
# package with two changes: `libsqlite3-sys` 0.30.1 -> 0.40.0, which bundles the fixed
# SQLite 3.54.1 (RUSTSEC-2026-0459; no sqlx release accepts a fixed `libsqlite3-sys`
# yet), and `SQLITE_DBCONFIG_NO_CKPT_ON_CLOSE` set straight after `sqlite3_open_v2`. Not an official sqlx version; origin, the exact change and
# when to remove it: `vendor/sqlx-sqlite/ATLAS_FORK.md`.
[patch.crates-io]
sqlx-sqlite = { path = "../vendor/sqlx-sqlite" }

[features]
# Demo modules for manual checks of the module manager (issue #12). Not part
# of a normal build.
demo-modules = []

[dev-dependencies]
# Unit tests run futures on a current-thread runtime; test-util = paused time for timeout tests.
# No `macros`: no new crate (decision 27 in #13).
tokio = { version = "1.54.1", features = ["rt", "time", "test-util"] }
# Storage tests read `SQLITE_DBCONFIG_NO_CKPT_ON_CLOSE` of an open connection through the
# raw handle (ADR-016). The same package and version sqlx already links (`links = "sqlite3"`
# allows one): no new crate. `bundled` is named so that the tests do not rely on feature
# unification with `sqlx-sqlite`.
libsqlite3-sys = { version = "=0.40.0", default-features = false, features = ["bundled"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# panic = "abort" from the template is intentionally removed:
# a panic in an optional module task must not terminate the whole app (see CLAUDE.md).
